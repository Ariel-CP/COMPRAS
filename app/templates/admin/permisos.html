{% extends "base.html" %} {% block title %}Permisos por rol{% endblock %} {%
block content %}
<section class="productos-wrapper">
  <style>
    .permission-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
    .permission-toolbar input[type="search"]{flex:1;min-width:220px;max-width:420px}
    .permission-tree{display:grid;gap:8px}
    .permission-group{border:1px solid #d9e0e5;border-radius:6px;background:#fff}
    .permission-group summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;font-weight:700;list-style:none}
    .permission-group summary::-webkit-details-marker{display:none}
    .permission-group summary:after{content:'+';margin-left:auto;color:#52616b;font-size:18px}
    .permission-group[open] summary:after{content:'−'}
    .permission-group-title{min-width:180px}
    .permission-head-checks,.permission-checks{display:grid;grid-template-columns:repeat(2,minmax(88px,1fr));gap:12px;align-items:center}
    .permission-head-checks{margin-left:auto;color:#52616b;font-size:12px;font-weight:600}
    .permission-head-checks label,.permission-checks label{display:flex;align-items:center;gap:7px;white-space:nowrap}
    .permission-group-count{font-size:12px;color:#60717d;font-weight:500}
    .permission-group-controls{display:flex;justify-content:flex-end;padding:0 14px 10px}
    .permission-items{border-top:1px solid #e5e9ec}
    .permission-item{display:grid;grid-template-columns:minmax(180px,1fr) minmax(196px,220px);gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid #edf0f2}
    .permission-item:last-child{border-bottom:0}
    .permission-item[hidden],.permission-group[hidden]{display:none}
    .permission-label{font-weight:600;color:#26343c}
    .permission-key{display:block;margin-top:2px;color:#75838b;font:11px ui-monospace,Consolas,monospace}
    .permission-checks input,.permission-head-checks input{width:16px;height:16px;accent-color:#176b5b}
    .permission-tree :focus-visible{outline:2px solid #176b5b;outline-offset:2px}
    @media(max-width:620px){.permission-group summary{flex-wrap:wrap;gap:8px}.permission-group-title{min-width:0;flex:1}.permission-head-checks{width:100%;margin-left:0}.permission-item{grid-template-columns:1fr;gap:8px;padding:10px}.permission-checks{max-width:240px}}
  </style>
  <h2>Permisos por rol</h2>

  <div class="panel panel-alta">
    <h3>Roles</h3>
    <form id="form-rol" class="form-alta" onsubmit="return crearRol(event);">
      <input
        required
        name="nombre"
        placeholder="Nombre de rol"
        maxlength="64"
      />
      <input name="descripcion" placeholder="Descripción" maxlength="255" />
      <button type="submit" class="btn-accion">Crear rol</button>
      <span id="rol-status" class="hint"></span>
    </form>

    <div class="tabla-controles">
      <label
        >Seleccionar rol:
        <select id="select-rol" onchange="cambiarRol()">
          {% for r in roles %}
          <option
            value="{{ r.id }}"
            {% if selected_role and selected_role.id == r.id %}selected{% endif %}
          >
            {{ r.nombre }} ({{ r.user_count or 0 }} usuarios)
          </option>
          {% endfor %}
        </select>
      </label>
      <button class="btn-accion" type="button" onclick="renombrarRol()">
        Renombrar/Editar
      </button>
      <button class="btn-accion" type="button" onclick="borrarRol()">
        Borrar rol
      </button>
    </div>
  </div>

  <div class="panel panel-listado">
    <div class="permission-toolbar">
      <label for="permission-search">Buscar formulario</label>
      <input id="permission-search" type="search" placeholder="Filtrar por nombre o clave" oninput="filtrarPermisos()" />
      <button class="btn-accion" type="button" onclick="guardarPermisos()">Guardar permisos</button>
      <span id="permission-count" class="hint" aria-live="polite"></span>
      <span id="perm-status" class="hint" aria-live="polite"></span>
    </div>
    <div id="permission-tree" class="permission-tree" aria-label="Permisos agrupados por formulario"></div>
  </div>
</section>
{% endblock %} {% block scripts %}
<script>
  let roles = {{ roles|tojson }};
  let permisos = {{ permisos|tojson }};
  let selectedRole = {{ selected_role|tojson }};
    const permissionCatalog = {{ permission_catalog|tojson }};

  function dataDesdeTabla(){
    const rows = document.querySelectorAll('#permission-tree [data-level="leer"]');
    const treePermissions = Array.from(rows).map(read => {
      const row = read.closest('.permission-item');
      return {
        form_key: read.dataset.key,
        puede_leer: read.checked,
        puede_escribir: row.querySelector('[data-level="escribir"]').checked,
      };
    });
    const representedKeys = new Set(treePermissions.map(permission => permission.form_key));
    const preservedLegacy = permisos.filter(permission => !representedKeys.has(permission.form_key));
    return [
      ...treePermissions.filter(permission => permission.puede_leer || permission.puede_escribir),
      ...preservedLegacy,
    ];
  }

  async function guardarPermisos(){
    if(!selectedRole){ alert('Seleccione un rol'); return; }
    const statusEl = document.getElementById('perm-status');
    statusEl.textContent = 'Guardando...';
    const payload = dataDesdeTabla();
    const res = await fetch(`/api/roles/${selectedRole.id}/perms`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      statusEl.textContent = err.detail || 'Error';
      statusEl.className = 'err';
      return;
    }
    const data = await res.json();
    permisos = data.permisos || [];
    renderPerms(permisos);
    statusEl.textContent = 'Guardado';
    statusEl.className = 'ok';
  }

  async function cambiarRol(){
    const sel = document.getElementById('select-rol');
    const id = sel.value;
    selectedRole = roles.find(r => String(r.id) === String(id));
    if(!selectedRole){ permisos = []; renderPerms(permisos); return; }
    const res = await fetch(`/api/roles/${id}/perms`);
    if(!res.ok){
      alert('No se pudieron cargar permisos');
      return;
    }
    const data = await res.json();
    permisos = data.permisos || [];
    renderPerms(permisos);
  }

  async function crearRol(ev){
    ev.preventDefault();
    const statusEl = document.getElementById('rol-status');
    statusEl.textContent = 'Creando...';
    const fd = new FormData(ev.target);
    const payload = {
      nombre: fd.get('nombre'),
      descripcion: fd.get('descripcion') || null,
    };
    const res = await fetch('/api/roles/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      statusEl.textContent = err.detail || 'Error';
      statusEl.className = 'err';
      return false;
    }
    const rol = await res.json();
    roles.push(rol);
    document.getElementById('select-rol').innerHTML = roles.map(r => `<option value="${r.id}">${r.nombre} (${r.user_count||0} usuarios)</option>`).join('');
    document.getElementById('select-rol').value = rol.id;
    selectedRole = rol;
    permisos = [];
    renderPerms(permisos);
    ev.target.reset();
    statusEl.textContent = 'Rol creado';
    statusEl.className = 'ok';
    return false;
  }

  async function renombrarRol(){
    if(!selectedRole){ alert('Seleccione un rol'); return; }
    const nuevo = prompt('Nuevo nombre de rol', selectedRole.nombre);
    if(!nuevo) return;
    const desc = prompt('Descripción', selectedRole.descripcion || '');
    const res = await fetch(`/api/roles/${selectedRole.id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre: nuevo, descripcion: desc })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      alert(err.detail || 'Error al actualizar rol');
      return;
    }
    const rol = await res.json();
    const idx = roles.findIndex(r => r.id === rol.id);
    if(idx>=0) roles[idx] = rol; else roles.push(rol);
    selectedRole = rol;
    document.getElementById('select-rol').innerHTML = roles.map(r => `<option value="${r.id}">${r.nombre} (${r.user_count||0} usuarios)</option>`).join('');
    document.getElementById('select-rol').value = rol.id;
  }

  async function borrarRol(){
    if(!selectedRole){ alert('Seleccione un rol'); return; }
    if(!confirm('¿Borrar rol? (solo si no tiene usuarios)')) return;
    const res = await fetch(`/api/roles/${selectedRole.id}`, { method: 'DELETE' });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      alert(err.detail || 'No se pudo borrar (¿tiene usuarios asociados?)');
      return;
    }
    roles = roles.filter(r => r.id !== selectedRole.id);
    document.getElementById('select-rol').innerHTML = roles.map(r => `<option value="${r.id}">${r.nombre} (${r.user_count||0} usuarios)</option>`).join('');
    selectedRole = roles[0] || null;
    if(selectedRole){ await cambiarRol(); }
    else { permisos = []; renderPerms(permisos); }
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[s]));
  }

  function renderPerms(data){
    permisos = data || [];
    const grouped = new Map();
    permissionCatalog.forEach(item => {
      if(!grouped.has(item.group)) grouped.set(item.group, []);
      grouped.get(item.group).push(item);
    });
    const tree = document.getElementById('permission-tree');
    tree.innerHTML = Array.from(grouped.entries()).map(([group, items]) => `
      <details class="permission-group" data-group="${escapeHtml(group)}">
        <summary>
          <span class="permission-group-title">${escapeHtml(group)}</span>
          <span class="permission-group-count" data-count-for="${escapeHtml(group)}"></span>
        </summary>
        <div class="permission-group-controls permission-head-checks">
          <label><input type="checkbox" data-group-level="leer" data-group-name="${escapeHtml(group)}" aria-label="Ver todos: ${escapeHtml(group)}" /> Ver todas</label>
          <label><input type="checkbox" data-group-level="escribir" data-group-name="${escapeHtml(group)}" aria-label="Editar todos: ${escapeHtml(group)}" /> Editar todas</label>
        </div>
        <div class="permission-items">
          ${items.map(item => {
            const current = permisos.find(permission => permission.form_key === item.form_key) || {};
            const write = Boolean(current.puede_escribir);
            const read = Boolean(current.puede_leer) || write;
            return `<div class="permission-item" data-label="${escapeHtml(`${item.label} ${item.form_key}`.toLowerCase())}" data-key="${escapeHtml(item.form_key)}" data-group="${escapeHtml(group)}">
              <div class="permission-label">${escapeHtml(item.label)}<span class="permission-key">${escapeHtml(item.form_key)}</span></div>
              <div class="permission-checks">
                <label><input type="checkbox" data-level="leer" data-key="${escapeHtml(item.form_key)}" ${read ? 'checked' : ''} /> Ver</label>
                <label><input type="checkbox" data-level="escribir" data-key="${escapeHtml(item.form_key)}" ${write ? 'checked' : ''} /> Editar</label>
              </div>
            </div>`;
          }).join('')}
        </div>
      </details>
    `).join('');
    updateGroupChecks();
    filtrarPermisos();
  }

  function updateGroupChecks(){
    document.querySelectorAll('[data-group-level]').forEach(parent => {
      const group = parent.dataset.groupName;
      const level = parent.dataset.groupLevel;
      const leaves = Array.from(document.querySelectorAll(`.permission-item[data-group="${CSS.escape(group)}"] [data-level="${level}"]`));
      const selected = leaves.filter(input => input.checked).length;
      parent.checked = leaves.length > 0 && selected === leaves.length;
      parent.indeterminate = selected > 0 && selected < leaves.length;
      const count = document.querySelector(`[data-count-for="${CSS.escape(group)}"]`);
      if(count && level === 'leer') count.textContent = `${selected}/${leaves.length} visibles`;
    });
    const checked = document.querySelectorAll('#permission-tree [data-level="leer"]:checked').length;
    const total = document.querySelectorAll('#permission-tree [data-level="leer"]').length;
    document.getElementById('permission-count').textContent = `${checked} de ${total} formularios visibles`;
  }

  function onTreeChange(event){
    const input = event.target;
    if(!(input instanceof HTMLInputElement)) return;
    if(input.matches('[data-group-level]')){
      const group = input.dataset.groupName;
      const level = input.dataset.groupLevel;
      document.querySelectorAll(`.permission-item[data-group="${CSS.escape(group)}"] [data-level="${level}"]`).forEach(leaf => {
        leaf.checked = input.checked;
        const row = leaf.closest('.permission-item');
        if(level === 'escribir' && input.checked) row.querySelector('[data-level="leer"]').checked = true;
        if(level === 'leer' && !input.checked) row.querySelector('[data-level="escribir"]').checked = false;
      });
    } else if(input.dataset.level === 'escribir' && input.checked){
      input.closest('.permission-item').querySelector('[data-level="leer"]').checked = true;
    } else if(input.dataset.level === 'leer' && !input.checked){
      input.closest('.permission-item').querySelector('[data-level="escribir"]').checked = false;
    }
    updateGroupChecks();
  }

  function filtrarPermisos(){
    const query = document.getElementById('permission-search').value.trim().toLocaleLowerCase('es');
    document.querySelectorAll('.permission-group').forEach(group => {
      let visible = 0;
      group.querySelectorAll('.permission-item').forEach(item => {
        const matches = !query || item.dataset.label.includes(query);
        item.hidden = !matches;
        if(matches) visible += 1;
      });
      group.hidden = visible === 0;
      if(query && visible > 0) group.open = true;
    });
  }

  function dataDesdeTabla(){
    return Array.from(document.querySelectorAll('#permission-tree [data-level="leer"]')).map(read => {
      const row = read.closest('.permission-item');
      return {
        form_key: read.dataset.key,
        puede_leer: read.checked,
        puede_escribir: row.querySelector('[data-level="escribir"]').checked,
      };
    }).filter(permission => permission.puede_leer || permission.puede_escribir);
  }

  document.getElementById('permission-tree').addEventListener('change', onTreeChange);
  renderPerms(permisos || []);
</script>
{% endblock %}
