{% extends 'base.html' %}
{% block title %}Configuración del sistema{% endblock %}

{% block content %}
<section class="panel" style="max-width:760px;">
  <h2 style="margin-top:0;">Configuración del BCRA</h2>
  <p class="hint" style="margin-top:0;">Aquí puede agregar el token que se usa para sincronizar tipos de cambio.</p>

  <form id="bcra-form" class="panel-filtros" style="margin-top:12px; align-items:flex-end;">
    <label style="display:flex; flex-direction:column; gap:6px; margin-right:12px; width:100%;">
      <span>Token BCRA</span>
      <input id="bcra-token" type="password" placeholder="Ingrese el token del BCRA" style="width:100%;" />
    </label>
    <button type="submit" class="btn-accion">Guardar</button>
  </form>

  <div id="bcra-msg" class="hint" style="margin-top:12px;"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const API_URL = '/api/system/settings';
  const form = document.getElementById('bcra-form');
  const input = document.getElementById('bcra-token');
  const msg = document.getElementById('bcra-msg');

  async function loadCurrent() {
    msg.textContent = '';
    try {
      const r = await fetch(API_URL);
      if (!r.ok) {
        msg.textContent = 'No se pudo cargar la configuración actual.';
        return;
      }
      const cfg = await r.json().catch(() => ({}));
      if (cfg && cfg.bcra_api_token) {
        input.value = cfg.bcra_api_token;
      }
    } catch (_) {
      msg.textContent = 'No se pudo cargar la configuración actual.';
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const token = input.value || null;
    msg.textContent = 'Guardando...';
    try {
      const r = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bcra_api_token: token }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        msg.textContent = (data && data.detail) ? data.detail : 'No se pudo guardar la configuración.';
        return;
      }
      msg.textContent = 'Configuración guardada correctamente.';
    } catch (_) {
      msg.textContent = 'Error de red al guardar la configuración.';
    }
  });

  loadCurrent();
})();
</script>
{% endblock %}
